<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANTHOLD — Disaster Gameplay Test</title><meta name="description" content="Play the current ANTHOLD duel with warning-driven disaster gameplay."><style>:root{--paper:#ebe2c0;--ink:#17110e;--danger:#cf3d26}body{margin:0;background:var(--paper);color:var(--ink);font:16px system-ui}iframe{border:0;width:100%;height:100dvh;display:block}p{margin:24px}</style></head><body><p id="status" role="status">Opening ANTHOLD…</p><script>
(async()=>{try{const root=new URL('../../../',location.href),response=await fetch(new URL('versus.html',root));if(!response.ok)throw Error('Game could not be loaded');let html=await response.text();html=html.replace('<head>','<head><base href="'+root.href+'">');const scripts=['disaster-engine.js','weather-effects.js','versus-adapter.js'].map(name=>'<script src="'+new URL(name,location.href).href+'"><\/script>').join('');html=html.includes('</body>')?html.replace('</body>',scripts+'</body>'):html+scripts;const frame=document.createElement('iframe');frame.title='ANTHOLD disaster gameplay';frame.srcdoc=html;document.body.replaceChildren(frame);}catch(e){document.getElementById('status').textContent=e.message+' — open this page through the same web host as the game, not as a local file.';}})();
</script></body></html>
